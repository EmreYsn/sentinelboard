# ─────────────────────────────────────────────────────────────
# Web Application Scanning / Recon Detection
# ─────────────────────────────────────────────────────────────
# Bu kural ne yapar?
#   Aynı IP'den kısa sürede çok fazla şüpheli HTTP isteği
#   gelirse alert üretir. Bu genellikle otomatik tarama
#   araçlarının (nikto, dirbuster, nmap http-enum) belirtisidir.
#
# Gerçek dünyada ne olur?
#   Saldırgan hedef siteyi keşfetmek için yüzlerce path dener:
#   /admin, /wp-admin, /.env, /backup.sql, /phpmyadmin...
#   Çoğu 404 döner ama saldırgan açık kapı arıyordur.
# ─────────────────────────────────────────────────────────────

title: Web Application Scanning Detected
id: sentinel-002
status: active
description: >
  Detects potential web application scanning by identifying
  multiple suspicious HTTP requests from the same source IP.
level: high

tags:
  - attack.reconnaissance
  - attack.t1595

logsource:
  product: nginx
  service: access

detection:
  selection:
    event_type: http_request
    is_suspicious: "True"
  condition: selection | count(src_ip) > 5
  timeframe: 10m

response:
  alert: true
  severity: high
  # Pencere 10 dakika; motorun 5 dakikalik varsayilani ile her tarama
  # iki alert uretiyordu. Cooldown pencereden kisa olmamali.
  cooldown: 10m
  message: "Web scanning detected: {count} suspicious requests from {src_ip}"

falsepositives:
  - Security scanners run by the infrastructure team
  - Vulnerability assessment tools (authorized)

author: Yasin Emre
date: 2026/07/25
references:
  - https://attack.mitre.org/techniques/T1595/
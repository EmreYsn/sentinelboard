# SentinelBoard — yerel geliştirme bağımlılıkları
#
# Sadece Redis içerir. Django tarafı SQLite kullandığı için
# ayrı bir veritabanı servisine ihtiyaç yoktur.
#
# Kullanım:  docker compose up -d

services:
  # ── Redis ───────────────────────────────────────
  # Collector → Parser arasındaki log kuyruğu (Redis Streams).
  redis:
    image: redis:7-alpine
    container_name: sentinel_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis_data: